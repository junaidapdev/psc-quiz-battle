<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSC Quiz Battle</title>

  <!-- Name, icon and colour when added to the phone home screen -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f5fd1">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="PSC Quiz">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Malayalam font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- Shown at the top when there is no internet, or for other problems -->
    <p id="notice" class="notice" role="alert" hidden></p>

    <!-- Start screen -->
    <section id="start-screen" class="screen">
      <h1 class="app-name">PSC Quiz Battle</h1>
      <p class="tagline">കേരള PSC പരീക്ഷയ്ക്ക് ദിവസവും 10 ചോദ്യങ്ങൾ. ഫോണിൽ, മലയാളത്തിൽ.</p>

      <!-- Shown when a friend's challenge link was opened -->
      <p id="challenge-card" class="challenge-card" hidden></p>

      <!-- Shown until we know if the player is logged in -->
      <p id="start-loading" class="list-message">ലോഡ് ചെയ്യുന്നു…</p>

      <!-- Shown when the player is logged out -->
      <div id="logged-out-box" hidden>
        <button id="login-button" class="main-button" type="button">Google ഉപയോഗിച്ച് ലോഗിൻ ചെയ്യുക</button>
        <p id="login-error" class="login-error" hidden></p>
      </div>

      <!-- Shown when the player is logged in -->
      <div id="logged-in-box" hidden>
        <div class="user-bar">
          <span id="user-name" class="user-name"></span>
          <button id="logout-button" class="logout-button" type="button">ലോഗ് ഔട്ട്</button>
        </div>

        <!-- Daily streak. app.js fills in the number. -->
        <p id="streak" class="streak" hidden></p>

        <!-- Topic choice. app.js adds one option for each topic.
             Hidden during a challenge: the questions are already chosen. -->
        <div id="topic-box" class="topic-box">
          <label for="topic-select" class="topic-label">വിഷയം തിരഞ്ഞെടുക്കുക</label>
          <select id="topic-select" class="topic-select">
            <option value="all">എല്ലാ വിഷയങ്ങളും</option>
          </select>
        </div>

        <button id="start-button" class="main-button" type="button">തുടങ്ങാം</button>

        <!-- Links to the other screens -->
        <div class="more-buttons">
          <button id="leaderboard-button" class="second-button" type="button">ഇന്നത്തെ ടോപ് 10</button>
          <button id="weak-topics-button" class="second-button" type="button">എന്റെ ദുർബല വിഷയങ്ങൾ</button>
        </div>
      </div>
    </section>

    <!-- Leaderboard screen: today's top 10, first names and scores only -->
    <section id="leaderboard-screen" class="screen" hidden>
      <h2 class="list-title">ഇന്നത്തെ ടോപ് 10</h2>
      <p id="leaderboard-message" class="list-message"></p>
      <!-- app.js fills in one row for each player -->
      <ol id="leaderboard-list" class="score-list"></ol>
      <button class="second-button back-button" type="button">തിരികെ</button>
    </section>

    <!-- My weak topics screen: lowest percent correct first -->
    <section id="weak-topics-screen" class="screen" hidden>
      <h2 class="list-title">എന്റെ ദുർബല വിഷയങ്ങൾ</h2>
      <p id="weak-topics-message" class="list-message"></p>
      <!-- app.js fills in one row for each topic -->
      <ol id="weak-topics-list" class="score-list"></ol>
      <button class="second-button back-button" type="button">തിരികെ</button>
    </section>

    <!-- Question screen -->
    <section id="question-screen" class="screen" hidden>
      <div class="top-bar">
        <span id="progress-text" class="progress-text">1 / 10</span>
        <span id="timer" class="timer">20</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <p id="question-topic" class="question-topic"></p>
      <h2 id="question-text" class="question-text"></h2>

      <!-- app.js fills in the four option buttons -->
      <div id="options" class="options"></div>
    </section>

    <!-- Result screen -->
    <section id="result-screen" class="screen" hidden>
      <p class="score-label">നിങ്ങളുടെ സ്കോർ</p>
      <p id="score" class="score">0 / 10</p>
      <!-- Shown only if saving the round fails -->
      <p id="save-error" class="save-error" hidden></p>
      <!-- After a challenge round: did I beat my friend? -->
      <p id="challenge-result" class="challenge-card" hidden></p>

      <!-- Challenge a friend: makes a link with these same questions -->
      <button id="challenge-button" class="second-button challenge-button" type="button">സുഹൃത്തിനെ വെല്ലുവിളിക്കൂ</button>
      <p id="challenge-message" class="challenge-message" hidden></p>
      <input id="challenge-link" class="challenge-link" type="text" readonly hidden aria-label="വെല്ലുവിളി ലിങ്ക്">

      <h2 id="mistakes-title" class="mistakes-title">തെറ്റിയ ചോദ്യങ്ങൾ</h2>
      <!-- app.js fills in one card for each wrong or missed question -->
      <div id="mistakes" class="mistakes"></div>

      <button id="try-again-button" class="main-button" type="button">വീണ്ടും ശ്രമിക്കാം</button>
    </section>

  </main>

  <!-- Supabase library, for Google login -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- questions.js must load before app.js -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
