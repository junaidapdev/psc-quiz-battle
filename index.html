<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSC Quiz Battle</title>

  <!-- Malayalam font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- Start screen -->
    <section id="start-screen" class="screen">
      <h1 class="app-name">PSC Quiz Battle</h1>
      <p class="tagline">കേരള PSC പരീക്ഷയ്ക്ക് ദിവസവും 10 ചോദ്യങ്ങൾ. ഫോണിൽ, മലയാളത്തിൽ.</p>

      <!-- Shown when the player is logged out -->
      <div id="logged-out-box">
        <button id="login-button" class="main-button" type="button">Google ഉപയോഗിച്ച് ലോഗിൻ ചെയ്യുക</button>
        <p id="login-error" class="login-error" hidden></p>
      </div>

      <!-- Shown when the player is logged in -->
      <div id="logged-in-box" hidden>
        <div class="user-bar">
          <span id="user-name" class="user-name"></span>
          <button id="logout-button" class="logout-button" type="button">ലോഗ് ഔട്ട്</button>
        </div>

        <!-- Topic choice. app.js adds one option for each topic. -->
        <label for="topic-select" class="topic-label">വിഷയം തിരഞ്ഞെടുക്കുക</label>
        <select id="topic-select" class="topic-select">
          <option value="all">എല്ലാ വിഷയങ്ങളും</option>
        </select>

        <button id="start-button" class="main-button" type="button">തുടങ്ങാം</button>
      </div>
    </section>

    <!-- Question screen -->
    <section id="question-screen" class="screen" hidden>
      <div class="top-bar">
        <span id="progress-text" class="progress-text">1 / 10</span>
        <span id="timer" class="timer">20</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <p id="question-topic" class="question-topic"></p>
      <h2 id="question-text" class="question-text"></h2>

      <!-- app.js fills in the four option buttons -->
      <div id="options" class="options"></div>
    </section>

    <!-- Result screen -->
    <section id="result-screen" class="screen" hidden>
      <p class="score-label">നിങ്ങളുടെ സ്കോർ</p>
      <p id="score" class="score">0 / 10</p>

      <h2 id="mistakes-title" class="mistakes-title">തെറ്റിയ ചോദ്യങ്ങൾ</h2>
      <!-- app.js fills in one card for each wrong or missed question -->
      <div id="mistakes" class="mistakes"></div>

      <button id="try-again-button" class="main-button" type="button">വീണ്ടും ശ്രമിക്കാം</button>
    </section>

  </main>

  <!-- Supabase library, for Google login -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- questions.js must load before app.js -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
